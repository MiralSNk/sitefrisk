spring.application.name=auth

server.port=${AUTH_PORT}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.structured.format.console=ecs
logging.structured.ecs.service.name=auth

# root остаётся на info, иначе debug фреймворка топит собственные логи.
# LOG_LEVEL управляет только нашим кодом.
logging.level.root=info
logging.level.com.sitefrisk=${LOG_LEVEL:info}