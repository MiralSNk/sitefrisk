syntax = "proto3";

package sitefrisk.scanner.v1;

option go_package = "github.com/MiralSNk/sitefrisk/contracts/scanner/v1;scannerv1";

// gRPC-интерфейс, который реализует Python (сервер),
// а Go-сканер вызывает как клиент.
service ScannerAnalysisService {    
  // Один вызов — все факты одного скана внутрь, полный отчёт наружу.
  // Не streaming: обмен разовый, не построчный — проще для первой версии,
  // stream можно добавить позже, если анализ станет пошаговым.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
}

message AnalyzeRequest { // Go-сканер отправляет собранные факты сюда для анализа.
    // Уникальный идентификатор задачи скана — тот же scan_id, что лежит
    // в очереди (Redis/NATS) и в Postgres. По нему потом сшивается
    // весь путь запроса в логах через correlation ID.
    string scan_id = 1; 

    // URL, который сканировался — нужен модели как контекст при генерации
    // отчёта (например, чтобы явно назвать домен в рекомендациях).
    string target_url = 2;

    // Список сырых фактов — набор может расти (новые типы проверок = новые
    // Fact с новым значением category), не требуя менять саму схему.
    repeated Fact facts = 3;
}

message Fact { // Один факт: заголовок, TLS-параметр, найденный открытый путь и т.д.
  // Категория факта — группирует находки по типу проверки.
  // Ожидаемые значения на старте: "header" | "tls" | "exposed_path".
  // Список открыт для расширения — не enum специально, чтобы добавлять
  // новые категории проверок без пересборки обеих сторон одновременно.
  string category = 1;

  // Ключ внутри категории, например: "Content-Security-Policy" для
  // category="header", или "protocol_version" для category="tls".
  string key = 2;

  // Значение как есть, без обработки — то, что сканер реально увидел
  // (значение заголовка, версия TLS, путь, вернувший 200 вместо 404).
  string value = 3;
}

message AnalyzeResponse {
  // Тот же scan_id из запроса — подтверждение, каким фактам
  // соответствует этот ответ (важно при retry/асинхронной обработке).
  string scan_id = 1;

  // Версия дообученной модели, которая сгенерировала ответ
  string model_version = 2; 

  // Список находок — уже интерпретированных, человекочитаемых
  // уязвимостей, а не сырых фактов.
  repeated Finding findings = 3;

  // Агрегированная оценка риска по всему сайту (например, 0.0–10.0).
  // Считается на стороне ML-сервиса из совокупности findings —
  // Go-сканер её не пересчитывает, просто отображает.
  float risk_score = 4;
}

message Finding { // Одна конкретная находка — то, что попадёт в отчёт пользователю.
  // Идентификатор класса уязвимости по CWE (Common Weakness Enumeration),
  string cwe_id = 1;

  // Критичность: low | medium | high | critical.
  // Строка, а не enum — сознательно (см. протобаф-конспект: enum жёстко
  // фиксирует набор значений на уровне схемы обеих сторон одновременно;
  // строка проще расширить/поменять шкалу без пересборки Go-сервиса).
  string severity = 2;

  // Человекочитаемое объяснение находки — то, что генерирует модель,
  // а не шаблонная фраза по cwe_id.
  string description = 3;

  // Конкретный совет по исправлению — тоже генерируется моделью,
  // не статичный текст из справочника по cwe_id.
  string recommendation = 4;
}

